<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaash: Know Your Dairy Cow</title>

  <!-- Two fonts only: Bricolage Grotesque (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Accessibility: lets keyboard users jump straight to content -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== Persistent top bar (lives on every screen) ===== -->
  <header class="app-bar">
    <button class="brand" data-goto="welcome" aria-label="Gaash — go to start">
      <span class="brand__mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 11 q6 -8 12 0 q-6 4 -12 0 Z" fill="#EBB84A"/>
        </svg>
      </span>
      <span class="brand__name">Gaash</span>
    </button>

    <div class="app-bar__right">
      <div class="stats" aria-label="Your progress">
        <span class="chip" id="chip-points">
          <svg class="chip__icon" width="16" height="16" viewBox="-9 -9 18 18" aria-hidden="true">
            <path d="M0,-8 L1.9,-2.6 L7.7,-2.5 L3,1 L4.8,6.6 L0,3.2 L-4.8,6.6 L-3,1 L-7.7,-2.5 L-1.9,-2.6 Z" fill="#EBB84A"/>
          </svg>
          <span id="points-value">0</span> pts
        </span>
        <span class="chip" id="chip-streak">
          <svg class="chip__icon" width="14" height="16" viewBox="0 0 14 16" aria-hidden="true">
            <path d="M7 1 c4 4 2 7 3 9 c1 2 -1 5 -3 5 c-3 0 -5 -3 -4 -6 c1 -2 3 -5 4 -8 Z" fill="#C9992F"/>
          </svg>
          <span id="streak-value">0</span>
        </span>
      </div>
      <button class="iconbtn" id="restart-btn" aria-label="Restart lesson" title="Restart lesson">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Restart
      </button>
    </div>
  </header>

  <!-- ===== Screens: only one is visible at a time ===== -->
  <main id="main">
    <!-- Screen 1 -->
    <section class="screen is-active" id="screen-welcome" aria-label="Welcome">
      <p class="placeholder">Screen 1 · Welcome — we build this next</p>
    </section>

    <!-- Screen 2 -->
    <section class="screen" id="screen-lesson" aria-label="Lesson">
      <p class="placeholder">Screen 2 · Lesson</p>
    </section>

    <!-- Screen 3 -->
    <section class="screen" id="screen-quiz" aria-label="Quiz">
      <p class="placeholder">Screen 3 · Quiz</p>
    </section>

    <!-- Screen 4 -->
    <section class="screen" id="screen-reward" aria-label="Lesson complete">
      <p class="placeholder">Screen 4 · Reward</p>
    </section>
  </main>

  <!-- Each lesson is a separate data file (data-driven & scalable) -->
  <script src="lessons/cow.js"></script>
  <script src="lessons/buffalo.js"></script>
  <script src="app.js"></script>
</body>
</html>
